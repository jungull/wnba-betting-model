version: 1
formatters:
  default:
    format: '[%(asctime)s] %(levelname)s %(name)s: %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    formatter: default
    level: INFO
  file:
    class: logging.handlers.RotatingFileHandler
    formatter: default
    filename: wnba_odds.log
    maxBytes: 10485760
    backupCount: 5
    level: INFO
root:
  handlers: [console, file]
  level: INFO 